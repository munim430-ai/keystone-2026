# A bare photo page rarely OCRs any text — deliberately left with zero keywords so it
# can never "win" a match; classify.py flags blank/near-blank pages as UNCERTAIN instead
# of guessing, and a human assigns these.
photo_korean: []

email_address:
  - "gmail.com"
  - "yahoo.com"
  - "outlook.com"
  - "Email Address"

air_ticket_booking:
